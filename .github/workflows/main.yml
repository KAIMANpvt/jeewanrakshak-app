name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then sudo apt-get install -y unzip; for z in *.zip; do unzip -o "$z"; done; rm -rf *.zip; fi
          PROJ=$(find . -type f -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', flutter-version: '3.32.0' }
      - name: Fix speech_to_text - Use Latest 7.x
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android build .dart_tool pubspec.lock
          
          # speech_to_text ko latest 7.x pe lao - 6.6.2 nahi
          python3 << 'PY'
          import pathlib, re
          text = pathlib.Path("pubspec.yaml").read_text()
          # purana hata ke naya lagao
          text = re.sub(r"speech_to_text:\s*[^\n]+", "speech_to_text: ^7.3.0", text)
          pathlib.Path("pubspec.yaml").write_text(text)
          print(text)
          PY

          flutter pub get
          flutter create --platforms=android .

          cat > android/local.properties << 'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          flutter.compileSdkVersion=35
          flutter.targetSdkVersion=35
          flutter.minSdkVersion=23
          flutter.ndkVersion=27.0.12077973
          flutter.versionCode=1
          flutter.versionName=1.0.0
          flutter.buildMode=release
          EOF
          
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

          cat > android/build.gradle.kts << 'EOF'
          buildscript {
              val kotlin_version by extra("2.1.0")
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.7.3")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          rootProject.buildDir = file("../build")
          subprojects { project.buildDir = file("${rootProject.buildDir}/${project.name}") }
          subprojects { project.evaluationDependsOn(":app") }
          tasks.register<Delete>("clean") { delete(rootProject.buildDir) }
          EOF

          NS=$(grep "namespace" android/app/build.gradle.kts | head -1 | cut -d'"' -f2)
          cat > android/app/build.gradle.kts << EOF
          plugins { id("com.android.application"); id("kotlin-android"); id("dev.flutter.flutter-gradle-plugin") }
          android {
              namespace = "$NS"
              compileSdk = 35
              ndkVersion = "27.0.12077973"
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              kotlinOptions { jvmTarget = "17" }
              defaultConfig { applicationId = "$NS"; minSdk = 23; targetSdk = 35; versionCode = flutter.versionCode; versionName = flutter.versionName }
              buildTypes { release { isMinifyEnabled = false; isShrinkResources = false } }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          flutter { source = "../.." }
          EOF

          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: jeewanrakshak-apks
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
