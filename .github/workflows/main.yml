name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            sudo apt-get install -y unzip
            for z in *.zip; do unzip -o "$z"; done
            rm -rf *.zip
          fi
          PROJ=$(find . -type f -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.0'

      - name: FIX app_links permanently
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          git checkout -- android/ || true
          
          # 1. pubspec.yaml me app_links ko latest 6.x pe force karo
          echo "Upgrading app_links in pubspec.yaml..."
          sed -i 's/app_links:.*/app_links: ^6.1.0/' pubspec.yaml || true
          sed -i 's/app_links: ^.*/app_links: ^6.1.0/' pubspec.yaml || true
          grep -n app_links pubspec.yaml || true

          # 2. Agar sed fail ho to dependency_overrides add karo
          if ! grep -q "dependency_overrides" pubspec.yaml; then
            echo "" >> pubspec.yaml
            echo "dependency_overrides:" >> pubspec.yaml
            echo "  app_links: ^6.1.0" >> pubspec.yaml
          fi
          cat pubspec.yaml | tail -20

          # 3. local.properties sahi se banao
          cat > android/local.properties << 'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          flutter.compileSdkVersion=35
          flutter.targetSdkVersion=35
          flutter.minSdkVersion=23
          flutter.ndkVersion=26.3.11579264
          EOF

          # 4. Gradle 8.7 + AGP 8.3.0
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.3.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          rootProject.buildDir = '../build'
          subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
          subprojects { project.evaluationDependsOn(':app') }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          EOF

          # 5. Purana lock hatake naya pub get karo
          rm -f pubspec.lock
          flutter clean
          flutter pub get
          flutter pub upgrade app_links

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: jeewanrakshak-apks
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
