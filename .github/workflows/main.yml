name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            sudo apt-get install -y unzip
            for z in *.zip; do unzip -o "$z"; done
            rm -rf *.zip
          fi
          PROJ=$(find . -type f -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'

      - name: RECREATE Android Folder - Ultimate Fix
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Original pubspec.yaml:"
          cat pubspec.yaml | grep -A2 app_links || true

          # 1. Purana kharab android folder hatao
          rm -rf android
          
          # 2. pubspec.lock hatao aur dependencies fix karo
          rm -f pubspec.lock
          sed -i 's/app_links:.*/app_links: ^3.4.4/' pubspec.yaml || true
          sed -i 's/geocoding:.*/geocoding: ^2.2.2/' pubspec.yaml || true
          sed -i 's/geocoding_android:.*/geocoding_android: 2.1.0/' pubspec.yaml || true
          
          # 3. Naya saaf android folder banao - ye Flutter 3.22 ke hisab se banega
          flutter clean
          flutter pub get
          flutter create --platforms=android .

          # 4. SDK 34 set karo local.properties me
          cat > android/local.properties << 'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          flutter.compileSdkVersion=34
          flutter.targetSdkVersion=34
          flutter.minSdkVersion=21
          flutter.ndkVersion=26.3.11579264
          flutter.versionCode=1
          flutter.versionName=1.0.0
          EOF

          echo "New android/app/build.gradle created:"
          ls -la android/app/build.gradle

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi -v

      - uses: actions/upload-artifact@v4
        with:
          name: jeewanrakshak-apks
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          
