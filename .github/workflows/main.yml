name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            sudo apt-get install -y unzip
            for z in *.zip; do unzip -o "$z"; done
            rm -rf *.zip
          fi
          PROJ=$(find . -type f -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV
          echo "Found project at $PROJ"

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Old Kotlin Version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Kotlin version 1.4 ko 1.9.22 se replace karo
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i "s/kotlin_version = '.*'/kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i "s/id 'org.jetbrains.kotlin.android' version '.*'/id 'org.jetbrains.kotlin.android' version '1.9.22' apply false/" android/settings.gradle || true
          sed -i "s/languageVersion.*1.4/languageVersion 1.8/g" android/build.gradle || true
          # jvmTarget fix
          sed -i "s/jvmTarget = '1.4'/jvmTarget = '1.8'/g" android/app/build.gradle || true
          sed -i "s/jvmTarget = \"1.4\"/jvmTarget = \"1.8\"/g" android/app/build.gradle || true
          echo "Kotlin fixed"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jeewanrakshak-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
