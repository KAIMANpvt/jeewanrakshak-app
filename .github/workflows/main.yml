name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            sudo apt-get install -y unzip
            for z in *.zip; do unzip -o "$z"; done
            rm -rf *.zip
          fi
          PROJ=$(find . -type f -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: FIX - Use Compatible Gradle Versions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # 1. Sabse stable Gradle 7.6.3 use karo
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.3-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

          # 2. build.gradle ko stable versions pe lao - AGP 7.4.2 + Kotlin 1.9.10
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.10'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF
          cat android/build.gradle

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: jeewanrakshak-apks
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
