name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            sudo apt-get install -y unzip
            for z in *.zip; do unzip -o "$z"; done
            rm -rf *.zip
          fi
          PROJ=$(find . -type f -name "pubspec.yaml" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.0'

      - name: SUPPORT sensors_plus 7.1.1 - No Downgrade
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android build .dart_tool pubspec.lock
          
          # Original pubspec ko wapas lao
          git checkout -- pubspec.yaml || true
          
          # Naya android folder LATEST Flutter 3.32 se banao - ye Kotlin 2.1 support karta hai
          flutter pub get
          flutter create --platforms=android .

          # local.properties me sab kuch set karo - isse app_links wala VersionUtils error bhi fix hoga
          cat > android/local.properties << 'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          flutter.compileSdkVersion=35
          flutter.targetSdkVersion=35
          flutter.minSdkVersion=23
          flutter.ndkVersion=27.0.12077973
          flutter.versionCode=1
          flutter.versionName=1.0.0
          flutter.buildMode=release
          EOF

          # android/build.gradle ko Kotlin 2.1.0 + AGP 8.3.0 pe lao
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '2.1.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.3.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          rootProject.buildDir = '../build'
          subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
          subprojects { project.evaluationDependsOn(':app') }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          EOF

          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          
          cat android/build.gradle
          cat android/local.properties
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: jeewanrakshak-apks
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
